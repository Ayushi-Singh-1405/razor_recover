<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Revoco</title>
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* Page-specific — everything else comes from theme.css */
    .page-center .card { width: 100%; max-width: 420px; }
    .btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }
    .status { text-align: center; min-height: 18px; }
    .footer { text-align: center; margin-top: var(--space-5); }
    .hidden { display: none; }
  </style>
</head>
<body class="page-center">
  <div>
    <div class="wordmark" style="text-align: center; margin-bottom: var(--space-5);">
      Revo<span class="accent">co</span>
    </div>

    <div class="card">
      <h2>Merchant sign in</h2>
      <p>Detect failed payments, recover checkout abandonment, and reclaim revenue — with policy-safe automation.</p>

      <div class="alert alert-danger hidden" id="error-banner"></div>

      <button class="btn btn-google hidden" id="google-btn" onclick="window.location.href='/auth/google/login'">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="status text-muted text-xs" id="status">Checking session…</div>
    </div>

    <div class="footer text-muted text-xs">Protected merchant access · Razorpay Test Mode</div>
  </div>

  <script>
    const btn = document.getElementById("google-btn");
    const statusEl = document.getElementById("status");
    const errorBanner = document.getElementById("error-banner");

    async function checkSession() {
    // file:// can't reach the API or same-origin cookies — show instructions.
    if (window.location.protocol === "file:") {
      errorBanner.textContent = "This page was opened as a local file. Start the backend "
        + "(from backend/: ../venv/bin/uvicorn main:app --reload) and open "
        + "http://localhost:8000/login instead.";
      errorBanner.style.display = "block";
      return;
    }

      try {
        const res = await fetch("/auth/me", { credentials: "same-origin" });
        if (res.ok) {
          statusEl.textContent = "Already signed in — redirecting to dashboard…";
          window.location.replace("/dashboard");
          return;
        }
        // 401 -> show the sign-in button
        btn.classList.remove("hidden");
        statusEl.textContent = "";
      } catch (err) {
        btn.classList.remove("hidden");
        statusEl.textContent = "";
        errorBanner.textContent = "Could not reach the Revoco API. Is the backend running?";
        errorBanner.style.display = "block";
      }
    }

    checkSession();
  </script>
</body>
</html>
