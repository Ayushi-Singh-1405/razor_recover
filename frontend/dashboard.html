<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — RecoverAI</title>
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* Page-specific — everything else comes from theme.css */
    .page-center .card { width: 100%; max-width: 480px; text-align: center; }

    .avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--color-accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto var(--space-4);
      font-size: var(--font-size-lg); font-weight: 700; color: #FFFFFF;
    }

    .placeholder {
      background: var(--color-bg-subtle);
      border: var(--border-default);
      border-radius: var(--radius-sm);
      padding: var(--space-4);
      font-size: var(--font-size-sm);
      line-height: 1.55;
      color: var(--color-text-secondary);
      margin-bottom: var(--space-4);
      text-align: left;
    }

    .status { text-align: center; min-height: 18px; }
  </style>
</head>
<body class="page-center">
  <div>
    <div class="wordmark" style="text-align: center; margin-bottom: var(--space-5);">
      Recover<span class="accent">AI</span>
    </div>

    <div class="card">
      <div class="avatar" id="avatar"></div>
      <h2 id="merchant-name">Loading…</h2>
      <p id="merchant-email"></p>

      <div class="placeholder">
        Dashboard metrics are coming in the next phase: at-risk volume,
        recovery rate, net ₹ recovered, and escalation actions.
      </div>

      <a class="btn" href="/auth/logout">Sign out</a>
    </div>

    <div class="status text-muted text-xs" id="status"></div>
  </div>

  <script>
    async function loadSession() {
    // file:// can't reach the API or same-origin cookies — show instructions.
    if (window.location.protocol === "file:") {
      errorBanner.textContent = "This page was opened as a local file. Start the backend "
        + "(from backend/: ../venv/bin/uvicorn main:app --reload) and open "
        + "http://localhost:8000/login instead.";
      errorBanner.style.display = "block";
      return;
    }

      try {
        const res = await fetch("/auth/me", { credentials: "same-origin" });
        if (res.status === 401) {
          window.location.replace("/login");
          return;
        }
        if (!res.ok) throw new Error("unexpected status " + res.status);
        const me = await res.json();
        document.getElementById("merchant-name").textContent =
          me.name ? "Welcome, " + me.name.split(" ")[0] : "Welcome";
        document.getElementById("merchant-email").textContent = me.email;
        const initial = (me.name || me.email || "?").trim()[0].toUpperCase();
        document.getElementById("avatar").textContent = initial;
      } catch (err) {
        document.getElementById("status").textContent =
          "Could not load session. Is the backend running?";
      }
    }

    loadSession();
  </script>
</body>
</html>
